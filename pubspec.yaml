name: imaji_binary_sdk
description: >-
  Generate a Flutter plugin or a native SwiftPM + Gradle wrapper for a
  closed-source binary SDK (xcframework, aar), with the vendor binary optional
  at build time.
version: 0.1.1
repository: https://github.com/saimskywalker/flutter-imaji-binary-sdk
issue_tracker: https://github.com/saimskywalker/flutter-imaji-binary-sdk/issues

topics:
  - swift-package-manager
  - xcframework
  - gradle
  - code-generation
  - flutter-plugin


environment:
  sdk: ^3.5.0

dependencies:
  args: ^2.6.0
  path: ^1.9.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0

executables:
  imaji-binary-sdk: imaji_binary_sdk
  # The name this tool had before it was renamed, kept so existing scripts and
  # docs that call `binary-sdk-bridge` keep working.
  binary-sdk-bridge: imaji_binary_sdk
